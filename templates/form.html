<!doctype html><html lang="uk"><meta charset="utf-8"><title>Книга — Назар Салівон</title><style>body{font:18px Arial;max-width:650px;margin:40px auto;background:#f5f5f1}label{display:block;margin:16px 0}input,select{display:block;width:95%;padding:10px;font:inherit}button{padding:12px;font:inherit}a{color:#164d86}</style><h1>{{'Редагувати книгу' if book else 'Додати книгу'}}</h1><form method="post">{% for key,label in [('title','Назва'),('author','Автор'),('year','Рік'),('genre','Жанр')] %}<label>{{label}}<input name="{{key}}" value="{{book[key] if book else ''}}" required {% if key=='year' %}type="number" min="1450" max="2100"{% endif %}></label>{% endfor %}<label>Статус<select name="status">{% for s in ['Не прочитано','Читаю','Прочитано'] %}<option {{'selected' if book and book.status==s else ''}}>{{s}}</option>{% endfor %}</select></label><button>Зберегти</button></form><p><a href="/">До списку</a></p></html>

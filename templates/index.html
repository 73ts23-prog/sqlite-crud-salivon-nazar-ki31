<!doctype html><html lang="uk"><meta charset="utf-8"><title>Моя бібліотека — Назар Салівон</title><style>body{font:18px Arial;max-width:1100px;margin:36px auto;padding:24px;background:#f5f5f1;color:#232a30}h1{font-size:30px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:14px;border:1px solid #ccd1d4;text-align:left}a{color:#164d86}button{padding:9px;cursor:pointer}header{margin-bottom:24px}small{color:#52606a}</style><header><h1>Моя бібліотека</h1><small>Салівон Назар · КІ-31 · Бази даних</small></header><p><a href="/add">Додати книгу</a></p><table><tr><th>ID</th><th>Назва</th><th>Автор</th><th>Рік</th><th>Жанр</th><th>Статус</th><th>Дії</th></tr>{% for b in books %}<tr><td>{{b.id}}</td><td>{{b.title}}</td><td>{{b.author}}</td><td>{{b.year}}</td><td>{{b.genre}}</td><td>{{b.status}}</td><td><a href="/edit/{{b.id}}">Редагувати</a><form method="post" action="/delete/{{b.id}}"><button>Видалити</button></form></td></tr>{% else %}<tr><td colspan="7">Книг ще немає.</td></tr>{% endfor %}</table></html>
